name: Build & Draft Release

# Triggers when you push a version tag: git tag v1.0.1 && git push origin v1.0.1
on:
  push:
    tags:
      - 'v*.*.*'

# Needed to create the draft release (default GITHUB_TOKEN may be read-only)
permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-22.04   # oldest supported glibc → AppImage runs on more distros

    steps:
      # ── Checkout ────────────────────────────────────────────────────────────
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0   # full history so we can generate commit-based notes

      # ── Node.js ─────────────────────────────────────────────────────────────
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      # ── Dependencies ─────────────────────────────────────────────────────────
      - name: Install dependencies
        run: npm ci

      - name: Rebuild native modules
        run: npx electron-builder install-app-deps

      # ── Build AppImage ───────────────────────────────────────────────────────
      - name: Build Linux AppImage
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npx electron-builder --linux AppImage --publish never

      # ── Generate commit-based changelog ─────────────────────────────────────
      # Collects all commits since the previous tag and groups them into a
      # draft changelog. You (or Claude) can then edit this before publishing.
      - name: Generate draft changelog
        run: |
          prev_tag=$(git describe --tags --abbrev=0 HEAD^ 2>/dev/null || true)

          if [ -n "$prev_tag" ]; then
            commits=$(git log "$prev_tag..HEAD" --pretty=format:"- %s (%h)" --no-merges)
          else
            commits=$(git log --pretty=format:"- %s (%h)" --no-merges)
          fi

          cat > release_notes.md <<EOF
          ## RohanKar Launcher ${GITHUB_REF_NAME} (Linux)

          > ✏️ **This is an auto-generated draft.** Edit the notes below before publishing.

          ---

          ## What's New
          <!-- Claude will fill this in each release -->

          ## Changes since ${prev_tag}

          ${commits}

          ---
          *Released $(date +%Y-%m-%d)*
          EOF

      # ── Create GitHub Draft Release ──────────────────────────────────────────
      - name: Create draft release
        uses: softprops/action-gh-release@v2
        with:
          draft: true           # DRAFT — you review & publish manually
          prerelease: false
          name: RohanKar Launcher ${{ github.ref_name }}
          body_path: release_notes.md
          files: |
            dist/*.AppImage
            dist/latest-linux.yml
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
